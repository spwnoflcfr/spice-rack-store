<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spice Rack Store</title>
    <!-- Import Pixel & Clean Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Updated Pastel / Glass Theme Colors */
            --pink-solid: #ea68a2;
            --bg-pastel: #fff0f5;
            --text-dark: #4a3642;
            --shadow-color: rgba(234, 104, 162, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-pastel);
            font-family: 'Quicksand', sans-serif;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Cute Sparkle / Star background to match the orb image */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#ffffff 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
        }

        /* Glassy "Bubble" Container - Light Pastel Theme */
        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem 1rem;
            margin: 2rem 1rem;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 40px;
            box-shadow: 0 15px 35px var(--shadow-color);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* 8-bit Pixel Header */
        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.8rem;
            line-height: 1.4;
            margin: 0 0 0.5rem 0;
            /* Pink Gradient Text */
            background: linear-gradient(to bottom, #fdb6da, #f6469c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            letter-spacing: 2px;
            word-break: break-word;
        }

        h2 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: #ce6b95;
            margin-bottom: 2rem;
            margin-top: 0;
            border-bottom: 2px solid #ffb3cc;
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        /* Product Grid */
        #product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            width: 100%;
            margin-bottom: 2rem;
        }

        /* Product Cards - White and clean */
        .product-item {
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 25px;
            border: 1px solid #ffe1ed;
            box-shadow: 0 4px 12px var(--shadow-color);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        .product-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow-color);
            border-color: #fbaac2;
        }

        .product-item h3 {
            font-size: 1.1rem;
            margin: 0;
            color: var(--text-dark);
        }

        .product-item p {
            margin: 0;
            font-size: 0.9rem;
            color: #7a5a6b;
        }

        /* Solid Pink "MiladySpice" Bottom Banner Style */
        .btn-buy {
            background-color: var(--pink-solid);
            color: #ffffff;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Quicksand', sans-serif;
            width: 100%;
            max-width: 180px;
            box-shadow: 0 4px 12px rgba(234, 104, 162, 0.3);
        }

        .btn-buy:hover {
            transform: scale(1.03);
            opacity: 0.9;
            box-shadow: 0 6px 16px rgba(234, 104, 162, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pixelated Pink Title -->
        <h1>SPICE RACK STORE</h1>
        
        <!-- Subtitle -->
        <h2>~ Milady Approved Spices ~</h2>

        <!-- Your Existing Product Container -->
        <div id="product-container">
            <div class="product-item">
                <h3>Paprika</h3>
                <p>Smoky & Sweet</p>
                <button class="btn-buy">Add to Cart</button>
            </div>
            <div class="product-item">
                <h3>Cinnamon</h3>
                <p>Warm & Spicy</p>
                <button class="btn-buy">Add to Cart</button>
            </div>
            <div class="product-item">
                <h3>Garlic Powder</h3>
                <p>Savory Kick</p>
                <button class="btn-buy">Add to Cart</button>
            </div>
        </div>
        
        <!-- Bottom pink bar (Updated inline style to hardcode pink and white text) -->
        <div style="width: 100%; background-color: #ea68a2; color: #ffffff; padding: 1rem 0; margin-top: 1rem; border-radius: 0 0 30px 30px;">
            <p style="margin: 0; font-weight: 700; font-size: 1.2rem; letter-spacing: 1px;">MiladySpice</p>
        </div>
    </div>

</body>
</html>
