<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spice Rack Store</title>
    <!-- Import Pixel & Clean Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Theme Colors from the images */
            --bg-dark: #0a0a0a;
            --pink-solid: #ea68a2;
            --pink-gradient: linear-gradient(to bottom, #fdb6da, #f6469c);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            font-family: 'Quicksand', sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* The Glassy "Bubble" Container */
        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem 1rem;
            margin: 2rem 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 0 30px rgba(234, 104, 162, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 8-bit Pixel Header */
        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.8rem;
            line-height: 1.4;
            margin: 0 0 0.5rem 0;
            /* Pink Gradient Text */
            background: var(--pink-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            letter-spacing: 2px;
            word-break: break-word;
        }

        h2 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: #ddd;
            margin-bottom: 2rem;
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        /* Product Grid */
        #product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            width: 100%;
            margin-bottom: 2rem;
        }

        /* Product Cards */
        .product-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            backdrop-filter: blur(2px);
        }

        .product-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(234, 104, 162, 0.3);
            border-color: #ea68a2;
        }

        .product-item h3 {
            font-size: 1.1rem;
            margin: 0;
            color: #fff;
        }

        .product-item p {
            margin: 0;
            font-size: 0.9rem;
            color: #bbb;
        }

        /* Solid Pink "MiladySpice" Bottom Banner Style */
        .btn-buy {
            background-color: var(--pink-solid);
            color: #ffffff;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s ease;
            font-family: 'Quicksand', sans-serif;
            width: 100%;
            max-width: 180px;
        }

        .btn-buy:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pixelated Pink Title -->
        <h1>SPICE RACK STORE</h1>
        
        <!-- Subtitle -->
        <h2>~ Milady Approved Spices ~</h2>

        <!-- Your Existing Product Container -->
        <div id="product-container">
            <div class="product-item">
                <h3>Paprika</h3>
                <p>Smoky & Sweet</p>
                <button class="btn-buy">Add to Cart</button>
            </div>
            <div class="product-item">
                <h3>Cinnamon</h3>
                <p>Warm & Spicy</p>
                <button class="btn-buy">Add to Cart</button>
            </div>
            <div class="product-item">
                <h3>Garlic Powder</h3>
                <p>Savory Kick</p>
                <button class="btn-buy">Add to Cart</button>
            </div>
            <!-- Add more product items as needed, the styling will automatically apply -->
        </div>
        
        <!-- A bottom pink bar similar to the MiladySpice image -->
        <div style="width: 100%; background-color: var(--pink-solid); padding: 1rem 0; margin-top: 1rem; border-radius: 0 0 30px 30px;">
            <p style="margin: 0; font-weight: 700; font-size: 1.2rem; letter-spacing: 1px;">MiladySpice</p>
        </div>
    </div>

</body>
</html>
