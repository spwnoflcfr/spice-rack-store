<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── FIX: Allow connections to Gooten API ─── -->
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' data: blob: https://api.print.io https://*.print.io;">

    <title>Spice Rack Store</title>
    <link rel="icon" href="e45a18e9-f45b-4f07-bfa3-47c5842bc957.png" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet" />
    <style>


                /* ─── PATTERNED EMOJI BUTTONS ─── */
        .btn-pattern-cupcake {
            background-image: repeating-linear-gradient(45deg, #ffb7c5 0px, #ffb7c5 30px, #ffd1dc 30px, #ffd1dc 60px);
            background-size: 60px 60px;
        }
        .btn-pattern-cupcake::before {
            content: "🧁"; font-size: 2.5rem; opacity: 0.3;
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            background-image: repeating-linear-gradient(45deg, transparent 0px, transparent 30px, #ff4d9e 30px, #ff4d9e 31px);
            background-size: 60px 60px;
        }

        .btn-pattern-pepper {
            background-image: repeating-linear-gradient(45deg, #ff4d9e 0px, #ff4d9e 30px, #ffb7c5 30px, #ffb7c5 60px);
            background-size: 60px 60px;
        }
        .btn-pattern-pepper::before {
            content: "🌶️"; font-size: 2.5rem; opacity: 0.4;
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }

        .btn-pattern-grin {
            background-image: repeating-linear-gradient(45deg, #ff9eb5 0px, #ff9eb5 30px, #ff4d9e 30px, #ff4d9e 60px);
            background-size: 60px 60px;
        }
        .btn-pattern-grin::before {
            content: "😁"; font-size: 2.5rem; opacity: 0.35;
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }

        /* Ensure the button container is relative so the absolute emoji overlays correctly */
        .buttons-container .cta-button {
            position: relative;
            overflow: hidden;
            z-index: 1;
            color: #000; /* Ensure text is visible over the pattern */
            text-shadow: 0 0 4px #ffffff, 0 0 8px #ffffff; /* Add white outline to text for readability */
        }
        /* Make sure text sits above the emoji overlay */
        .buttons-container .cta-button i,
        .buttons-container .cta-button span {
            position: relative;
            z-index: 2;
        }
        /* ── RESET & BASE ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DotGothic16', sans-serif;
            background: #0a0a12;
            color: #ffb7c5;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .crt-effect {
            position: relative;
            min-height: 100vh;
            background: linear-gradient(to bottom, #1a001a, #000);
            overflow: hidden;
        }
        .crt-effect::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            z-index: 10;
        }
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0) 100%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9;
            animation: scanline 10s linear infinite;
        }
        @keyframes scanline { 0% { background-position: 0 0; } 100% { background-position: 0 100%; } }

        /* ────────── TOP STOREFRONT DRAWER ────────── */
        .api-trigger {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: linear-gradient(135deg, #ffb7c5, #ff4d9e);
            border: 2px solid #ffffff;
            color: #000000;
            padding: 8px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 77, 158, 0.4);
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 30px;
        }
        .api-trigger:hover {
            background: #ffffff;
            color: #ff4d9e;
            box-shadow: 0 0 35px #ffffff;
        }
        .api-trigger .badge {
            background: #000000;
            color: #ffffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DotGothic16', sans-serif;
            animation: pulse-badge 1.5s infinite;
        }
        @keyframes pulse-badge {
            0% { opacity: 0.6; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.6; transform: scale(0.9); }
        }

        .api-drawer {
            position: fixed;
            top: -80vh;
            left: 0;
            width: 100%;
            height: 70vh;
            z-index: 150;
            background: rgba(10, 10, 18, 0.96);
            border-bottom: 4px solid #ff4d9e;
            box-shadow: 0 15px 60px rgba(255, 77, 158, 0.2);
            transition: top 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 20px 30px;
            overflow-y: auto;
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
        }
        .api-drawer.open { top: 0; }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff4d9e;
            padding-bottom: 12px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .drawer-header h2 {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
            color: #ff4d9e;
            text-shadow: 0 0 10px #ff4d9e;
            letter-spacing: 2px;
        }
        .drawer-header h2 i { margin-right: 8px; }
        .drawer-close {
            background: none;
            border: none;
            color: #ff007f;
            font-size: 1.8rem;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            transition: 0.2s;
        }
        .drawer-close:hover { transform: rotate(90deg); color: #ffb7c5; }

        .storefront-body {
            flex: 1;
            display: flex;
            gap: 20px;
            overflow: hidden;
            min-height: 0;
        }
        .product-grid {
            flex: 2;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding-right: 8px;
        }
        .product-grid::-webkit-scrollbar { width: 4px; }
        .product-grid::-webkit-scrollbar-track { background: #1a001a; }
        .product-grid::-webkit-scrollbar-thumb { background: #ff4d9e; border-radius: 4px; }

        .product-card {
            background: rgba(30, 0, 20, 0.5);
            border: 2px solid #ff4d9e;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .product-card:hover { border-color: #ffffff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.15); }
        .product-card img {
            width: 100%;
            max-height: 120px;
            object-fit: contain;
            border-radius: 4px;
            background: #1a001a;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .product-card .no-image {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #663366;
            background: #1a001a;
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .product-card .name {
            font-size: 0.6rem;
            color: #ffd1dc;
            font-family: 'DotGothic16', sans-serif;
            margin-bottom: 2px;
            word-break: break-word;
            line-height: 1.3;
            min-height: 2.2em;
        }
        .product-card .sku-label {
            font-size: 0.5rem;
            color: #a0337a;
            font-family: 'DotGothic16', sans-serif;
            opacity: 0.6;
            margin-bottom: 4px;
        }
        .product-card .price {
            font-size: 0.8rem;
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            margin: 4px 0;
        }

        /* ─── PATTERNED BUTTONS FOR PRODUCT ACTIONS ─── */
        .product-actions {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: auto;
        }
        .product-actions button {
            flex: 1;
            border: none;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.4rem;
            padding: 6px 4px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            text-transform: uppercase;
            color: #fff;
            /* Base pattern for all 3 buttons: small repeating pink sparkle/star */
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 4px, rgba(255,77,158,0.1) 4px, rgba(255,77,158,0.1) 8px);
            background-size: 11px 11px;
        }
        .btn-quickview {
            background-color: #a0337a;
        }
        .btn-quickview:hover { background-color: #ffd1dc; color: #000; background-image: none; }
        .btn-addcart {
            background-color: #ff4d9e;
        }
        .btn-addcart:hover { background-color: #ffffff; color: #000; box-shadow: 0 0 12px #ffffff; background-image: none; }
        .btn-instabuy {
            background-color: #ff007f;
        }
        .btn-instabuy:hover { background-color: #ffb7c5; color: #000; background-image: none; }
        
        .product-actions button:disabled { opacity: 0.4; cursor: not-allowed; }

        .product-card .loading-placeholder {
            width: 100%;
            height: 80px;
            background: rgba(255, 77, 158, 0.05);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #663366;
            font-size: 0.6rem;
            font-family: 'Press Start 2P', cursive;
            animation: pulse-loading 1.5s infinite;
        }
        @keyframes pulse-loading {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* ─── QUICK VIEW MODAL ─── */
        .quickview-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .quickview-modal.open { display: flex; }
        .quickview-content {
            background: #1a001a;
            border: 3px solid #ff4d9e;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 0 40px rgba(255, 77, 158, 0.5);
        }
        .quickview-close {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 1.5rem;
            color: #ff007f;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
        }
        .quickview-close:hover { color: #fff; }
        .quickview-content img {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .quickview-content h2 { font-family: 'Press Start 2P', cursive; font-size: 1rem; color: #ffffff; margin-bottom: 10px; }
        .quickview-content p { font-size: 0.8rem; color: #ffd1dc; margin-bottom: 15px; line-height: 1.4; }

        /* ── Cart sidebar ── */
        .cart-sidebar {
            flex: 1;
            min-width: 200px;
            max-width: 280px;
            background: rgba(30, 0, 20, 0.6);
            border: 2px solid #ff4d9e;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .cart-sidebar h3 {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            color: #ffb7c5;
            border-bottom: 1px solid #ff4d9e;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin: 8px 0;
            font-size: 0.65rem;
        }
        .cart-items::-webkit-scrollbar { width: 3px; }
        .cart-items::-webkit-scrollbar-track { background: #1a001a; }
        .cart-items::-webkit-scrollbar-thumb { background: #ff4d9e; border-radius: 3px; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 77, 158, 0.1);
            gap: 4px;
        }
        .cart-item .name { flex: 1; color: #ffd1dc; font-size: 0.55rem; word-break: break-word; }
        .cart-item .qty { display: flex; gap: 3px; align-items: center; }
        .cart-item .qty button {
            background: none;
            border: 1px solid #ff4d9e;
            color: #ff4d9e;
            width: 18px;
            height: 18px;
            cursor: pointer;
            font-size: 0.6rem;
            border-radius: 3px;
            font-family: 'Press Start 2P', cursive;
        }
        .cart-item .qty button:hover { background: #ff4d9e; color: #000; }
        .cart-item .price { color: #ffffff; margin-left: 4px; font-size: 0.6rem; }
        .cart-item .remove-btn {
            background: none;
            border: none;
            color: #ff007f;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0 4px;
        }

        .cart-total {
            border-top: 2px solid #ff4d9e;
            padding-top: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            color: #ffb7c5;
        }
        .checkout-btn {
            background: #ff4d9e;
            color: #000;
            border: none;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 8px;
            width: 100%;
            transition: 0.2s;
        }
        .checkout-btn:hover { background: #ffffff; box-shadow: 0 0 12px #ffffff; }
        .checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .checkout-form {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
            border-top: 2px solid #ff4d9e;
            padding-top: 10px;
        }
        .checkout-form.open { display: flex; }
        .checkout-form input {
            background: #1a001a;
            border: 1px solid #ff4d9e;
            color: #ffb7c5;
            padding: 5px 8px;
            font-family: 'DotGothic16', sans-serif;
            font-size: 0.65rem;
            border-radius: 4px;
            width: 100%;
        }
        .checkout-form input::placeholder { color: #663366; }
        .checkout-form .form-row { display: flex; gap: 6px; }
        .checkout-form .form-row input { flex: 1; }
        .checkout-form .submit-order {
            background: #ff007f;
            color: #fff;
            border: none;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.55rem;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        .checkout-form .submit-order:hover { background: #ffb7c5; box-shadow: 0 0 15px #ffb7c5; }
        .checkout-form .submit-order:disabled { opacity: 0.4; cursor: not-allowed; }

        .order-status {
            margin-top: 6px;
            font-size: 0.65rem;
            color: #ffb7c5;
            text-align: center;
            min-height: 1.5em;
        }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .storefront-body { flex-direction: column; overflow-y: auto; }
            .cart-sidebar { max-width: none; min-width: 0; flex: none; max-height: 200px; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); max-height: 300px; }
            .api-drawer {
                top: auto;
                bottom: -85vh;
                height: 80vh;
                border-bottom: none;
                border-top: 4px solid #ff4d9e;
                transition: bottom 0.4s cubic-bezier(0.22, 1, 0.36, 1);
                border-radius: 20px 20px 0 0;
                padding: 20px 20px 30px;
            }
            .api-drawer.open { top: auto; bottom: 0; }
            .drawer-header h2 { font-size: 0.7rem; }
            .api-trigger { font-size: 0.5rem; padding: 5px 14px; gap: 8px; top: 4px; }
            .api-trigger .badge { width: 16px; height: 16px; font-size: 0.4rem; }
            .cart-item .name { font-size: 0.5rem; }
            .product-actions { flex-direction: column; gap: 4px; }
        }
        @media (max-width: 420px) {
            .product-grid { grid-template-columns: 1fr; }
        }

        .mobile-drawer-handle {
            display: none;
            position: fixed;
            bottom: -10px;
            left: 0;
            width: 100%;
            z-index: 150;
            justify-content: center;
            padding: 5px 0;
            pointer-events: none;
        }
        .mobile-drawer-handle .handle-bar {
            width: 60px;
            height: 6px;
            background: #ff4d9e;
            border-radius: 20px;
            opacity: 0.5;
            pointer-events: none;
        }
        @media (max-width: 768px) {
            .mobile-drawer-handle { display: flex; pointer-events: none; }
        }

        /* ────────── SIDE DRAWERS ────────── */
        .side-drawer-trigger {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            background: #1a001a;
            border: 2px solid #ff4d9e;
            color: #ff4d9e;
            padding: 12px 8px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 77, 158, 0.2);
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border-radius: 8px 0 0 8px;
            writing-mode: vertical-rl;
            letter-spacing: 2px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
        }
        .side-drawer-trigger:hover {
            background: #ff4d9e;
            color: #000;
            box-shadow: 0 0 35px #ff4d9e;
        }
        .side-drawer-trigger i { font-size: 1.2rem; margin-bottom: 4px; }

        #discordTrigger { left: 0; border-radius: 0 12px 12px 0; border-left: none; }
        #spotifyTrigger { right: 0; border-radius: 12px 0 0 12px; border-right: none; }

        .side-drawer {
            position: fixed;
            top: 0;
            height: 100%;
            width: 380px;
            z-index: 160;
            background: rgba(10, 10, 18, 0.96);
            backdrop-filter: blur(8px);
            padding: 20px 20px 30px;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0 40px rgba(255, 77, 158, 0.15);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .side-drawer.left { left: 0; transform: translateX(-105%); border-right: 4px solid #ff4d9e; }
        .side-drawer.right { right: 0; transform: translateX(105%); border-left: 4px solid #ff4d9e; }
        .side-drawer.open { transform: translateX(0); }

        .side-drawer .drawer-header {
            border-bottom-color: #ff4d9e;
            flex-shrink: 0;
        }
        .side-drawer .drawer-header h2 {
            font-size: 0.8rem;
            color: #ffb7c5;
        }
        .side-drawer .drawer-header .drawer-close {
            color: #ff007f;
            font-size: 1.5rem;
        }

        .side-drawer .widget-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
        }
        .side-drawer .widget-container iframe {
            width: 100%;
            height: 100%;
            min-height: 400px;
            border-radius: 12px;
            border: none;
            background: transparent;
        }

        @media (max-width: 768px) {
            .side-drawer { width: 100%; max-width: 100%; padding: 15px; }
            .side-drawer .widget-container iframe { min-height: 300px; }
            .side-drawer-trigger { padding: 8px 6px; font-size: 0.5rem; }
            .side-drawer-trigger i { font-size: 1rem; }
        }

        /* ── Original site styles ── */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; position: relative; z-index: 5; }
        .pixel-border {
            border: 4px solid #ff4d9e;
            position: relative;
            margin: 50px auto 20px auto;
            max-width: 900px;
            box-shadow: 0 0 10px #ff4d9e, inset 0 0 10px #ff4d9e;
            background: rgba(20, 0, 15, 0.7);
        }
        .pixel-border::before, .pixel-border::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff4d9e;
        }
        .pixel-border::before { top: -4px; left: -4px; }
        .pixel-border::after { bottom: -4px; right: -4px; }
        .content { padding: 30px 20px; text-align: center; }
        .logo-link { text-decoration: none; }
        .logo {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            margin-bottom: 10px;
            color: #ff4d9e;
            text-shadow: 0 0 10px #ff4d9e;
            line-height: 1.4;
            display: block;
        }
        .glitch {
            position: relative;
            display: inline-block;
            color: #ff4d9e;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch::before { left: 2px; text-shadow: -2px 0 #00ffff; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim 5s infinite linear alternate-reverse; }
        .glitch::after { left: -2px; text-shadow: -2px 0 #ff007f; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim2 5s infinite linear alternate-reverse; }
        @keyframes glitch-anim { 0% { clip: rect(42px, 9999px, 44px, 0); } 100% { clip: rect(4px, 9999px, 91px, 0); } }
        @keyframes glitch-anim2 { 0% { clip: rect(65px, 9999px, 100px, 0); } 100% { clip: rect(38px, 9999px, 49px, 0); } }
        .subtitle { font-size: clamp(0.8rem, 2.5vw, 1.2rem); margin-bottom: 30px; color: #ff99cc; }
        .project-box {
            margin: 30px 0;
            padding: 20px;

        .project-box::after { content: "<<"; position: absolute; right: 10px; bottom: 10px; color: #ff4d9e; }

        .buttons-container { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
        .cta-button {
            background: #ff4d9e;

        .cta-button:hover { background: #ffffff; color: #000; box-shadow: 0 0 10px #ffffff; }
        .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #ff4d9e; font-size: clamp(0.6rem, 2vw, 0.8rem); color: #ff99cc; }

        /* ─── Floating X and Linktree (Reverted to Standard Single Icons) ─── */
        .x-float {
            position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px;
            background: #ffffff; /* Standard white for X */
            border: 3px solid #ff4d9e;
            border-radius: 50%; display: flex; justify-content: center;

        .x-float:hover {

            background: #1a1a1a;
            box-shadow: 0 0 35px #ff4d9e, 0 0 60px #ffb7c5;
        }
        .x-float i { font-size: 2rem; }

        .linktree-float {
            position: fixed; bottom: 25px; left: 25px; width: 65px; height: 65px;
            background: #39e09e;

            border-radius: 50%; display: flex; justify-content: center;

            box-shadow: 0 0 25px rgba(255, 77, 158, 0.8);

        .linktree-float:hover { 
            transform: scale(1.15); 
            box-shadow: 0 0 35px #ff4d9e, 0 0 60px #ffb7c5;
        }
        .linktree-float i { font-size: 2rem; }

        /* ─── FALLING BACKGROUND ELEMENTS ─── */
        .sakura-container { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none;

            filter: drop-shadow(0 0 10px #ff4d9e) drop-shadow(0 0 2px #ffffff);

        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

    <!-- REVERTED: Standard X and Linktree Icons -->
    <a href="https://x.com/MiladySpice" class="x-float" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
    <a href="https://linktr.ee/miladyspice" class="linktree-float" target="_blank"><i class="fa-solid fa-tree"></i></a>

    <script>
        // ─── FALLING BACKGROUND ELEMENTS (Pills, Syringes, Wine) ───
        function createSakura() {
            const container = document.getElementById('sakuraContainer');
            container.innerHTML = '';
            const emojis = ['💊', '💉', '🍷'];
            const count = Math.min(30, Math.floor(window.innerWidth / 25));
            for (let i = 0; i < count; i++) {
                const element = document.createElement('div');
                element.classList.add('sakura');
                element.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                element.style.left = Math.random() * 100 + 'vw';
                const size = 20 + Math.random() * 24;
                element.style.fontSize = size + 'px';
                element.style.animationDuration = (12 + Math.random() * 18) + 's';
                element.style.animationDelay = (Math.random() * 20) + 's';
                element.style.opacity = 0.3 + Math.random() * 0.6;
                container.appendChild(element);
            }
        }
        document.addEventListener('DOMContentLoaded', createSakura);
        window.addEventListener('resize', createSakura);

        // ─── GOOTEN API CONFIG ───
        const RECIPE_ID = '7bfd3d48-97c6-4450-a188-9c3289946be1';
        const PARTNER_BILLING_KEY_RAW = '0AF5+RRxmfSDp8rDQa7fQMc2RU1Mq6Z34j2eY4c0G1c=';
        const PARTNER_BILLING_KEY_ENCODED = encodeURIComponent(PARTNER_BILLING_KEY_RAW);

        // ─── API SKUs (ACTIVE PRODUCTS) ───
        // Limited to the Car Magnet for testing.
        const PRODUCT_SKUS = [
            { sku: 'CarMagnet_3x11.5', price: 12.99, currency: 'USD' }
        ];

        // ─── DOM refs ───
        const apiTrigger = document.getElementById('apiTrigger');
        const apiDrawer = document.getElementById('apiDrawer');
        const apiClose = document.getElementById('drawerClose');
        const productGrid = document.getElementById('productGrid');
        const cartItems = document.getElementById('cartItems');
        const cartCount = document.getElementById('cartCount');
        const cartTotal = document.getElementById('cartTotal');
        const cartBadge = document.getElementById('cartBadge');
        const checkoutToggle = document.getElementById('checkoutToggle');
        const checkoutForm = document.getElementById('checkoutForm');
        const submitOrderBtn = document.getElementById('submitOrderBtn');
        const orderStatus = document.getElementById('orderStatus');

        // ─── State ───
        let cart = [];
        let productCatalog = null; // cached catalog
        let isFetching = false;

        // ─── Drawer toggle ───
        function toggleTopDrawer() {
            apiDrawer.classList.toggle('open');
            if (apiDrawer.classList.contains('open')) {
                if (!productCatalog && !isFetching) {
                    fetchProductCatalog();
                } else if (productCatalog) {
                    renderProducts();
                }
            }
        }
        apiTrigger.addEventListener('click', toggleTopDrawer);
        apiClose.addEventListener('click', toggleTopDrawer);

        // ─── Side drawers ───
        const discordTrigger = document.getElementById('discordTrigger');
        const discordDrawer = document.getElementById('discordDrawer');
        const discordClose = document.getElementById('discordClose');
        const spotifyTrigger = document.getElementById('spotifyTrigger');
        const spotifyDrawer = document.getElementById('spotifyDrawer');
        const spotifyClose = document.getElementById('spotifyClose');

        function toggleDiscord() { discordDrawer.classList.toggle('open'); }
        function toggleSpotify() { spotifyDrawer.classList.toggle('open'); }
        discordTrigger.addEventListener('click', toggleDiscord);
        discordClose.addEventListener('click', toggleDiscord);
        spotifyTrigger.addEventListener('click', toggleSpotify);
        spotifyClose.addEventListener('click', toggleSpotify);

        document.addEventListener('click', (e) => {
            if (discordDrawer.classList.contains('open') && !discordDrawer.contains(e.target) && !discordTrigger.contains(e.target)) {
                discordDrawer.classList.remove('open');
            }
            if (spotifyDrawer.classList.contains('open') && !spotifyDrawer.contains(e.target) && !spotifyTrigger.contains(e.target)) {
                spotifyDrawer.classList.remove('open');
            }
        });

        // ─── API helper ───
        async function gootenFetch(endpoint, options = {}) {
            const separator = endpoint.includes('?') ? '&' : '?';
            const url = `${endpoint}${separator}recipeId=${RECIPE_ID}&partnerBillingKey=${PARTNER_BILLING_KEY_ENCODED}`;
            const response = await fetch(url, {
                ...options,
                headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            return response.json();
        }

        // ─── Fetch product catalog from API ───
        async function fetchProductCatalog() {
            if (isFetching) return;
            isFetching = true;
            productGrid.innerHTML = `
                <div style="grid-column:1/-1; text-align:center; padding:30px; color:#ffb7c5;">
                    <div style="font-family:'Press Start 2P',cursive; font-size:0.7rem;">Loading products...</div>
                    <div style="margin-top:10px; font-size:0.5rem; color:#663366;">⏳ Fetching from Gooten API</div>
                </div>
            `;

            try {
                const data = await gootenFetch('https://api.print.io/api/products');
                const catalog = {};
                if (data && data.Items) {
                    data.Items.forEach(item => {
                        const sku = item.Sku || '';
                        const name = item.Name || sku;
                        const imageUrl = item.Images && item.Images.length > 0 ? item.Images[0].Url : null;
                        catalog[sku] = { name, imageUrl };
                    });
                }
                productCatalog = catalog;
                renderProducts();
            } catch (error) {
                console.error('Error fetching product catalog:', error);
                productGrid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:30px; color:#ff007f;">
                        <div style="font-family:'Press Start 2P',cursive; font-size:0.7rem;">⚠ Failed to load products</div>
                        <div style="margin-top:8px; font-size:0.5rem; color:#884444;">${error.message}</div>
                        <button onclick="fetchProductCatalog()" style="margin-top:12px; background:#ff4d9e; color:#000; border:none; font-family:'Press Start 2P',cursive; font-size:0.5rem; padding:8px 16px; cursor:pointer; border-radius:4px;">Retry</button>
                    </div>
                `;
            } finally {
                isFetching = false;
            }
        }

        // ─── Render products ───
        function renderProducts() {
            if (!productCatalog) {
                productGrid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:30px; color:#ffb7c5;">
                        <div style="font-family:'Press Start 2P',cursive; font-size:0.7rem;">Loading products...</div>
                    </div>
                `;
                return;
            }

            if (!PRODUCT_SKUS.length) {
                productGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:20px; color:#ffb7c5;">No products available.</div>';
                return;
            }

            productGrid.innerHTML = '';
            PRODUCT_SKUS.forEach((product) => {
                const catalogItem = productCatalog[product.sku];
                const displayName = catalogItem?.name || product.sku;
                const imageUrl = catalogItem?.imageUrl || null;
                const displaySku = product.sku;

                const card = document.createElement('div');
                card.className = 'product-card';

                let imageHtml = '';
                if (imageUrl) {
                    imageHtml = `<img src="${imageUrl}" alt="${displayName}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" /><div class="no-image" style="display:none;"><i class="fas fa-cube"></i></div>`;
                } else {
                    imageHtml = `<div class="no-image"><i class="fas fa-cube"></i></div>`;
                }

                card.innerHTML = `
                    ${imageHtml}
                    <div class="name">${displayName}</div>
                    <div class="sku-label">SKU: ${displaySku}</div>
                    <div class="price">$${product.price.toFixed(2)} ${product.currency}</div>
                    <div class="product-actions">
                        <button class="btn-quickview" data-sku="${product.sku}" data-name="${displayName}" data-image="${imageUrl || ''}" data-price="${product.price}" data-currency="${product.currency}">Quick View</button>
                        <button class="btn-addcart" data-sku="${product.sku}" data-price="${product.price}" data-currency="${product.currency}" data-name="${displayName}">Add to Cart</button>
                        <button class="btn-instabuy" data-sku="${product.sku}" data-price="${product.price}" data-currency="${product.currency}" data-name="${displayName}">Insta-Buy</button>
                    </div>
                `;
                productGrid.appendChild(card);
            });

            // Attach event listeners
            document.querySelectorAll('.btn-addcart').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const sku = btn.dataset.sku;
                    const price = parseFloat(btn.dataset.price);
                    const currency = btn.dataset.currency;
                    const name = btn.dataset.name;
                    addToCart({ sku, price, currency, name });
                });
            });

            document.querySelectorAll('.btn-quickview').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    openQuickView(btn.dataset.sku, btn.dataset.name, btn.dataset.image, btn.dataset.price, btn.dataset.currency);
                });
            });

            document.querySelectorAll('.btn-instabuy').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const sku = btn.dataset.sku;
                    const price = parseFloat(btn.dataset.price);
                    const currency = btn.dataset.currency;
                    const name = btn.dataset.name;
                    instaBuy({ sku, price, currency, name });
                });
            });
        }

        // ─── Quick View Modal ───
        function openQuickView(sku, name, image, price, currency) {
            const modalHtml = `
                <div class="quickview-modal open" id="quickviewModal">
                    <div class="quickview-content">
                        <span class="quickview-close" onclick="closeQuickView()">✕</span>
                        ${image ? `<img src="${image}" alt="${name}" />` : '<div style="font-size:3rem; color:#663366;"><i class="fas fa-cube"></i></div>'}
                        <h2>${name}</h2>
                        <p>SKU: ${sku}</p>
                        <p style="font-family:'Press Start 2P',cursive; font-size:1.2rem; color:#ffffff;">$${parseFloat(price).toFixed(2)} ${currency}</p>
                        <div class="product-actions" style="margin-top:15px; justify-content:center;">
                            <button class="btn-addcart" data-sku="${sku}" data-price="${price}" data-currency="${currency}" data-name="${name}" style="flex:0 1 auto; padding:10px 20px; font-size:0.6rem;">Add to Cart</button>
                            <button class="btn-instabuy" data-sku="${sku}" data-price="${price}" data-currency="${currency}" data-name="${name}" style="flex:0 1 auto; padding:10px 20px; font-size:0.6rem;">Insta-Buy</button>
                        </div>
                    </div>
                </div>
            `;
            
            // Remove old modal if exists, append new one
            const oldModal = document.getElementById('quickviewModal');
            if(oldModal) oldModal.remove();
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            // Re-attach listeners for the new buttons inside the modal
            const newModal = document.getElementById('quickviewModal');
            newModal.querySelector('.btn-addcart').addEventListener('click', (e) => {
                const sku = e.target.dataset.sku;
                const price = parseFloat(e.target.dataset.price);
                const currency = e.target.dataset.currency;
                const name = e.target.dataset.name;
                addToCart({ sku, price, currency, name });
                closeQuickView();
            });
            newModal.querySelector('.btn-instabuy').addEventListener('click', (e) => {
                const sku = e.target.dataset.sku;
                const price = parseFloat(e.target.dataset.price);
                const currency = e.target.dataset.currency;
                const name = e.target.dataset.name;
                instaBuy({ sku, price, currency, name });
                closeQuickView();
            });
            // Close modal if clicking outside content
            newModal.addEventListener('click', (e) => {
                if (e.target === newModal) closeQuickView();
            });
        }

        function closeQuickView() {
            const modal = document.getElementById('quickviewModal');
            if(modal) modal.remove();
        }

        // ─── Cart functions ───
        function addToCart(product) {
            const existing = cart.find(item => item.sku === product.sku);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            renderCart();
            updateBadge();
            orderStatus.textContent = `✅ ${product.name} added to cart!`;
            orderStatus.style.color = '#88ff88';
            setTimeout(() => { orderStatus.textContent = ''; }, 3000);
        }

        function removeFromCart(sku) {
            cart = cart.filter(item => item.sku !== sku);
            renderCart();
            updateBadge();
        }

        function changeQuantity(sku, delta) {
            const item = cart.find(i => i.sku === sku);
            if (!item) return;
            item.quantity += delta;
            if (item.quantity <= 0) {
                removeFromCart(sku);
            } else {
                renderCart();
                updateBadge();
            }
        }

        function renderCart() {
            if (!cart.length) {
                cartItems.innerHTML = '<div style="color:#663366; text-align:center; padding:10px 0;">Your cart is empty</div>';
                cartTotal.textContent = '$0.00';
                cartCount.textContent = '0';
                return;
            }
            let html = '';
            let total = 0;
            cart.forEach(item => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                html += `
                    <div class="cart-item">
                        <span class="name">${item.name || item.sku}</span>
                        <div class="qty">
                            <button data-sku="${item.sku}" data-delta="-1">−</button>
                            <span>${item.quantity}</span>
                            <button data-sku="${item.sku}" data-delta="1">+</button>
                        </div>
                        <span class="price">${(item.price * item.quantity).toFixed(2)}</span>
                        <button class="remove-btn" data-sku="${item.sku}">✕</button>
                    </div>
                `;
            });
            cartItems.innerHTML = html;
            cartTotal.textContent = `${total.toFixed(2)} ${cart[0]?.currency || 'USD'}`;
            cartCount.textContent = cart.reduce((sum, i) => sum + i.quantity, 0);

            document.querySelectorAll('.qty button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const sku = btn.dataset.sku;
                    const delta = parseInt(btn.dataset.delta);
                    changeQuantity(sku, delta);
                });
            });
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    removeFromCart(btn.dataset.sku);
                });
            });
        }

        function updateBadge() {
            const count = cart.reduce((sum, i) => sum + i.quantity, 0);
            cartBadge.textContent = count;
            cartBadge.style.background = count > 0 ? '#ffffff' : '#000000';
        }

        // ─── Checkout toggle ───
        checkoutToggle.addEventListener('click', () => {
            if (cart.length === 0) {
                orderStatus.textContent = '⚠ Your cart is empty.';
                orderStatus.style.color = '#ff007f';
                return;
            }
            checkoutForm.classList.toggle('open');
            checkoutToggle.textContent = checkoutForm.classList.contains('open') ? 'Hide Checkout' : 'Checkout';
        });

        // ─── Insta-Buy Logic ───
        async function instaBuy(product) {
            if(!product) return;
            
            // Auto-fill the checkout form instantly
            document.getElementById('firstName').value = 'John';
            document.getElementById('lastName').value = 'Doe';
            document.getElementById('addressLine1').value = '123 Main St';
            document.getElementById('addressLine2').value = '';
            document.getElementById('city').value = 'Los Angeles';
            document.getElementById('state').value = 'CA';
            document.getElementById('postalCode').value = '90001';
            document.getElementById('country').value = 'US';
            document.getElementById('phone').value = '555-123-4567';
            document.getElementById('email').value = 'john@example.com';

            orderStatus.textContent = `⚡ Processing Insta-Buy for ${product.name}...`;
            orderStatus.style.color = '#ffb7c5';

            // Clear existing cart, add this item, open checkout, and submit.
            cart = [];
            addToCart(product);
            checkoutForm.classList.add('open');
            checkoutToggle.textContent = 'Hide Checkout';
            
            // Click the submit button programmatically after a short delay
            setTimeout(() => {
                submitOrderBtn.click();
            }, 500);
        }

        // ─── Submit order ───
        submitOrderBtn.addEventListener('click', async () => {
            if (cart.length === 0) {
                orderStatus.textContent = '⚠ Cart is empty.';
                orderStatus.style.color = '#ff007f';
                return;
            }

            const getVal = (id) => document.getElementById(id).value.trim() || 'N/A';
            const firstName = getVal('firstName');
            const lastName = getVal('lastName');
            const line1 = getVal('addressLine1');
            const line2 = getVal('addressLine2') || '';
            const city = getVal('city');
            const state = getVal('state');
            const postal = getVal('postalCode');
            const country = getVal('country');
            const phone = getVal('phone');

            const orderData = {
                ShipToAddress: {
                    FirstName: firstName,
                    LastName: lastName,
                    Line1: line1,
                    Line2: line2,
                    City: city,
                    State: state,
                    CountryCode: country,
                    PostalCode: postal,
                    Phone: phone,
                    IsBusinessAddress: false,
                },
                BillingAddress: {
                    FirstName: firstName,
                    LastName: lastName,
                    Line1: line1,
                    Line2: line2,
                    City: city,
                    State: state,
                    CountryCode: country,
                    PostalCode: postal,
                    Phone: phone,
                },
                Items: cart.map(item => ({
                    Sku: item.sku,
                    Quantity: item.quantity,
                    ShipType: 'standard',
                })),
                PartnerBillingKey: PARTNER_BILLING_KEY_ENCODED,
            };

            submitOrderBtn.disabled = true;
            submitOrderBtn.textContent = 'Submitting...';
            orderStatus.textContent = '⏳ Placing order...';
            orderStatus.style.color = '#ffb7c5';

            try {
                const result = await gootenFetch('https://api.print.io/api/orders', {
                    method: 'POST',
                    body: JSON.stringify(orderData),
                });
                orderStatus.textContent = `✅ Order placed! ID: ${result.OrderId || 'success'}`;
                orderStatus.style.color = '#88ff88';
                cart = [];
                renderCart();
                updateBadge();
                checkoutForm.classList.remove('open');
                checkoutToggle.textContent = 'Checkout';
            } catch (err) {
                console.error(err);
                orderStatus.textContent = `❌ Error: ${err.message || 'Unknown error'}`;
                orderStatus.style.color = '#ff007f';
            } finally {
                submitOrderBtn.disabled = false;
                submitOrderBtn.textContent = 'Place Order';
            }
        });

        // ─── Mobile drag ───
        let startY = 0, currentY = 0, isDragging = false;
        apiDrawer.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
        }, { passive: true });
        apiDrawer.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
        }, { passive: true });
        apiDrawer.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            const diff = startY - currentY;
            if (diff < -60 && apiDrawer.classList.contains('open')) {
                toggleTopDrawer();
            }
            startY = 0; currentY = 0;
        }, { passive: true });

        // ─── Init ───
        renderCart();
        updateBadge();
        console.log('🛒 Storefront ready! Click "Store" to open.');
        console.log('📦 Fetching product catalog from Gooten API...');
    </script>
</body>
</html>
